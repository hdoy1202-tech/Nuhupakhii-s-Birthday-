
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday Nuha ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #fff;
  color: #202020;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
}

.page {
  width: 100%;
  height: 100svh;
  min-height: 600px;
  overflow: hidden;
  position: relative;
  background: radial-gradient(ellipse at 75% 40%, #fffaf3, #fff 65%);
}

/* TEXT */

.intro {
  position: absolute;
  left: 8%;
  top: 28%;
  z-index: 3;
  animation: enter 1.4s ease both;
}

.intro h1 {
  font-size: clamp(38px, 5.5vw, 76px);
  line-height: 1.08;
  font-weight: 500;
  letter-spacing: -3px;
}

.intro h1 span {
  display: block;
}

.orange {
  color: #e7a052;
  font-weight: 600;
}

.intro p {
  margin-top: 20px;
  font-size: 11px;
  line-height: 2;
  max-width: 300px;
  color: #a5a5a5;
}

/* CIRCULAR ORBIT */

.orbit-area {
  position: absolute;
  top: 50%;
  left: 70%;
  width: 420px;
  height: 420px;
  transform: translate(-50%, -50%);
  z-index: 2;
}

.orbit {
  width: 100%;
  height: 100%;
  position: relative;
  animation: orbitSpin 40s linear infinite;
}

.orbit-photo {
  position: absolute;
  width: 90px;
  height: 115px;
  object-fit: cover;
  padding: 6px;
  background: white;
  box-shadow: 0 8px 25px #00000012;
  left: 50%;
  top: 50%;
  transform:
    translate(-50%, -50%)
    rotate(var(--a))
    translateY(-165px);
  animation: photoBob 4s ease-in-out infinite;
  animation-delay: var(--d);
}

/* BOTTOM CURVED GALLERY */

.curve-gallery {
  position: absolute;
  width: 120%;
  left: -10%;
  bottom: -60px;
  height: 250px;
  overflow: hidden;
  z-index: 4;
}

.curve-track {
  display: flex;
  align-items: flex-start;
  width: max-content;
  animation: trackMove 45s linear infinite;
}

.curve-track img {
  flex-shrink: 0;
  width: 100px;
  height: 125px;
  object-fit: cover;
  padding: 6px;
  background: white;
  box-shadow: 0 7px 25px #00000010;
  margin: 0 12px;
}

/* Curve */

.curve-track img:nth-child(8n+1) {
  margin-top: 105px;
  transform: rotate(-9deg);
}

.curve-track img:nth-child(8n+2) {
  margin-top: 70px;
  transform: rotate(-6deg);
}

.curve-track img:nth-child(8n+3) {
  margin-top: 38px;
  transform: rotate(-3deg);
}

.curve-track img:nth-child(8n+4) {
  margin-top: 15px;
  transform: rotate(1deg);
}

.curve-track img:nth-child(8n+5) {
  margin-top: 0px;
  transform: rotate(5deg);
}

.curve-track img:nth-child(8n+6) {
  margin-top: 15px;
  transform: rotate(7deg);
}

.curve-track img:nth-child(8n+7) {
  margin-top: 45px;
  transform: rotate(5deg);
}

.curve-track img:nth-child(8n+8) {
  margin-top: 78px;
  transform: rotate(1deg);
}

/* FLOATING DECOR */

.decor {
  position: absolute;
  color: #e7b77c;
  opacity: .55;
  animation: decorFloat 4s ease-in-out infinite;
}

.decor.one {
  top: 18%;
  right: 9%;
  font-size: 20px;
}

.decor.two {
  bottom: 15%;
  right: 18%;
  font-size: 13px;
  animation-delay: 1s;
}

.decor.three {
  top: 12%;
  left: 47%;
  font-size: 11px;
  animation-delay: 2s;
}

.footer {
  position: absolute;
  bottom: 15px;
  left: 25px;
  font-size: 9px;
  color: #bdbdbd;
  letter-spacing: 1.2px;
  z-index: 6;
}

/* ANIMATIONS */

@keyframes orbitSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes photoBob {
  0%, 100% { margin-top: 0; }
  50% { margin-top: -8px; }
}

@keyframes trackMove {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

@keyframes decorFloat {
  0%, 100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-13px) rotate(12deg); }
}

@keyframes enter {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* MOBILE LAYOUT */

@media(max-width:700px) {
  .page {
    min-height: 100svh;
    height: 100svh;
  }

  .intro {
    top: 8%;
    left: 7%;
  }

  .intro h1 {
    font-size: 43px;
    line-height: 1.06;
    letter-spacing: -2px;
  }

  .intro p {
    font-size: 10px;
    max-width: 260px;
    margin-top: 12px;
    line-height: 1.8;
  }

  .orbit-area {
    top: 57%;
    left: 50%;
    width: 310px;
    height: 310px;
  }

  .orbit-photo {
    width: 74px;
    height: 96px;
    transform:
      translate(-50%, -50%)
      rotate(var(--a))
      translateY(-122px);
  }

  .curve-gallery {
    bottom: -58px;
    height: 160px;
    width: 140%;
    left: -20%;
  }

  .curve-track img {
    width: 78px;
    height: 95px;
    margin-left: 7px;
    margin-right: 7px;
  }

  .curve-track img:nth-child(8n+1) { margin-top: 65px; }
  .curve-track img:nth-child(8n+2) { margin-top: 43px; }
  .curve-track img:nth-child(8n+3) { margin-top: 23px; }
  .curve-track img:nth-child(8n+4) { margin-top: 8px; }
  .curve-track img:nth-child(8n+5) { margin-top: 0; }
  .curve-track img:nth-child(8n+6) { margin-top: 10px; }
  .curve-track img:nth-child(8n+7) { margin-top: 28px; }
  .curve-track img:nth-child(8n+8) { margin-top: 48px; }

  .footer {
    bottom: 10px;
    left: 12px;
    font-size: 8px;
  }
}

@media(max-width:380px) {
  .intro h1 {
    font-size: 38px;
  }

  .orbit-area {
    width: 275px;
    height: 275px;
    top: 59%;
  }

  .orbit-photo {
    width: 66px;
    height: 86px;
    transform:
      translate(-50%, -50%)
      rotate(var(--a))
      translateY(-108px);
  }
}

/* Reduce motion accessibility */
@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation-duration: 20s !important;
  }
}
</style>
</head>

<body>

</body>
